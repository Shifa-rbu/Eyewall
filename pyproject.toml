[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# CI runs bare `ruff check .`, and ruff's default rule set is not stable across
# releases: 0.16 enables far more than the historic E4/E7/E9/F default, so an
# untouched tree started failing a green pipeline. The set is therefore pinned
# explicitly here and widened only on purpose.
select = [
    "E4", "E7", "E9", "F",   # ruff's historic default
    "W", "I", "UP", "B", "C4",  # warnings, import order, modern syntax, bugbear
    "SIM", "ISC", "PERF", "PIE", "RUF", "BLE",
]
# Assertions in tests compare against physical constants on purpose; a magic
# value there is the assertion, not a smell.
per-file-ignores = { "tests/*" = ["PLR2004"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
